{% extends "base.html" %}

{% block content %}

<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

<div class="container mt-4">

    <div class="card shadow-lg border-0">

        <div class="card-header bg-success text-white">
            <h4 class="mb-0">
                ♻ Record Waste Purchase / Collection
            </h4>
        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="row">

                    <!-- SUPPLIER -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Supplier *
                        </label>

                        <select
                            name="supplier"
                            id="supplier"
                            class="form-select supplier-select"
                            required
                        >
                            <option value="">
                                Search Supplier...
                            </option>

                            {% for supplier in suppliers %}
                            <option value="{{ supplier.id }}">
                                {{ supplier.company_name }} - {{ supplier.phone }}
                            </option>
                            {% endfor %}

                        </select>

                    </div>

                    <!-- CATEGORY -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Waste Type *
                        </label>

                        <select
                            name="category"
                            id="categorySelect"
                            class="form-select"
                            required
                        >
                            <option value="">
                                -- Select Waste Type --
                            </option>

                            {% for category in categories %}
                            <option
                                value="{{ category.id }}"
                                data-name="{{ category.name|lower }}"
                            >
                                {{ category.name }}
                            </option>
                            {% endfor %}

                        </select>

                    </div>

                    <!-- NORMAL QUANTITY -->
                    <div class="col-md-6 mb-3" id="quantitySection">

                        <label class="form-label fw-bold">
                            Quantity (KG)
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            name="quantity"
                            class="form-control"
                            placeholder="Enter Quantity"
                        >

                    </div>

                    <!-- TIMBER SECTION -->
                    <div
                        id="timberSection"
                        style="display:none;"
                    >

                        <div class="col-md-4 mb-3">

                            <label class="form-label fw-bold">
                                Timber Size
                            </label>

                            <select
                                name="timber_size"
                                class="form-select"
                            >
                                <option value="">Select Size</option>

                                <option>2x2</option>
                                <option>2x3</option>
                                <option>2x4</option>
                                <option>3x2</option>
                                <option>3x3</option>
                                <option>4x2</option>
                                <option>4x4</option>
                                <option>6x2</option>
                                <option>8x2</option>

                            </select>

                        </div>

                        <div class="col-md-4 mb-3">

                            <label class="form-label fw-bold">
                                Length (Feet)
                            </label>

                            <select
                                name="timber_length"
                                class="form-select"
                            >
                                <option value="">Select Length</option>

                                <option>8</option>
                                <option>10</option>
                                <option>12</option>
                                <option>14</option>
                                <option>16</option>
                                <option>18</option>
                                <option>20</option>

                            </select>

                        </div>

                        <div class="col-md-4 mb-3">

                            <label class="form-label fw-bold">
                                Pieces
                            </label>

                            <input
                                type="number"
                                min="1"
                                name="timber_pieces"
                                class="form-control"
                                placeholder="Number of pieces"
                            >

                        </div>

                    </div>

                    <!-- UNIT PRICE -->
                    <div class="col-md-6 mb-3">

                        <label
                            id="priceLabel"
                            class="form-label fw-bold"
                        >
                            Unit Price (KES per KG)
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            name="unit_price"
                            class="form-control"
                            required
                        >

                    </div>

                    <!-- PAYMENT -->
                    <div class="col-md-12 mt-3">

                        <div class="card bg-light border-0">

                            <div class="card-body">

                                <div class="form-check form-switch">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="is_paid_on_delivery"
                                        id="is_paid_on_delivery"
                                        checked
                                    >

                                    <label
                                        class="form-check-label fw-bold text-success"
                                        for="is_paid_on_delivery"
                                    >
                                        Paid Instantly On-Site
                                    </label>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

                <hr>

                <button
                    type="submit"
                    class="btn btn-success px-4"
                >
                    💾 Save Purchase
                </button>

            </form>

        </div>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>

$(document).ready(function () {

    $('.supplier-select').select2({
        width: '100%',
        placeholder: 'Search Supplier',
        allowClear: true
    });

    $("#categorySelect").change(function () {

        let selected =
            $(this).find(':selected').data('name') || '';

        if (selected.includes('timber')) {

            $("#timberSection").show();

            $("#quantitySection").hide();

            $("#priceLabel").text(
                "Price Per Piece (KES)"
            );

        } else {

            $("#timberSection").hide();

            $("#quantitySection").show();

            $("#priceLabel").text(
                "Unit Price (KES per KG)"
            );
        }

    });

});

</script>

{% endblock %}
