{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">


<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="fw-bold">Add Employee</h2>
    <a href="{% url 'employee_list' %}" class="btn btn-outline-dark">
        Back
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body">

        <form method="POST">
            {% csrf_token %}

            <div class="row g-3">

                <!-- USER ACCOUNT -->
                <div class="col-md-12">
                    <label class="form-label fw-bold">
                        System User Account
                    </label>

                    <select name="user" class="form-select">
                        <option value="">
                            -------- Select User --------
                        </option>

                        {% for user in users %}
                            <option value="{{ user.id }}">
                                {{ user.username }}
                                {% if user.first_name %}
                                    - {{ user.first_name }} {{ user.last_name }}
                                {% endif %}
                            </option>
                        {% endfor %}
                    </select>

                    <small class="text-muted">
                        Link this employee to a login account.
                    </small>
                </div>

                <div class="col-md-6">
                    <label class="form-label">First Name</label>
                    <input type="text"
                           name="first_name"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Last Name</label>
                    <input type="text"
                           name="last_name"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Employee Number</label>
                    <input type="text"
                           name="employee_number"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Phone</label>
                    <input type="text"
                           name="phone"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Email</label>
                    <input type="email"
                           name="email"
                           class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Position</label>
                    <input type="text"
                           name="position"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Department</label>
                    <input type="number"
                           name="department"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Hire Date</label>
                    <input type="date"
                           name="hire_date"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Basic Salary</label>
                    <input type="number"
                           name="basic_salary"
                           class="form-control"
                           step="0.01">
                </div>

                <div class="col-12">
                    <label class="form-label">Address</label>
                    <textarea name="address"
                              class="form-control"
                              rows="3"></textarea>
                </div>

                <div class="col-md-6">
                    <label class="form-label">
                        Emergency Contact Name
                    </label>
                    <input type="text"
                           name="emergency_contact_name"
                           class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">
                        Emergency Contact Phone
                    </label>
                    <input type="text"
                           name="emergency_contact_phone"
                           class="form-control">
                </div>

            </div>

            <button type="submit"
                    class="btn btn-primary mt-4">
                Save Employee
            </button>

        </form>

    </div>
</div>


</div>

{% endblock %}
