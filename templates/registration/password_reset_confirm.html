<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create New Password | Wareng MRF ERP</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f5132,#198754);
    font-family:'Segoe UI',sans-serif;
}

.reset-card{

    width:100%;
    max-width:550px;

    background:white;

    border-radius:20px;

    padding:40px;

    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.logo{
    width:90px;
    display:block;
    margin:auto;
    margin-bottom:15px;
}

h2{
    text-align:center;
    margin-bottom:25px;
}

input{

    width:100%;

    padding:12px;

    border:1px solid #ced4da;

    border-radius:10px;

    margin-bottom:15px;
}

.btn-save{

    width:100%;

    background:#198754;

    border:none;

    color:white;

    padding:12px;

    border-radius:10px;

    font-weight:700;
}

.btn-save:hover{
    background:#146c43;
}

</style>

</head>

<body>

<div class="reset-card">

    <img src="/static/images/logo.png" class="logo">

    <h2>Create New Password</h2>

    {% if validlink %}

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn-save">
                Save New Password
            </button>

        </form>

    {% else %}

        <div class="alert alert-danger">

            This password reset link is invalid
            or has already been used.

        </div>

        <a href="{% url 'password_reset' %}"
           class="btn btn-danger w-100">

            Request New Link

        </a>

    {% endif %}

</div>

</body>
</html>
