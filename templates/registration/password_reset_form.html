<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password | Wareng MRF ERP</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(
        135deg,
        #0f5132,
        #198754,
        #20c997
    );
    font-family:'Segoe UI', sans-serif;
}

.reset-wrapper{
    width:100%;
    max-width:520px;
    padding:20px;
}

.reset-card{

    background:rgba(255,255,255,0.97);

    backdrop-filter:blur(10px);

    border-radius:20px;

    overflow:hidden;

    box-shadow:
    0 20px 60px rgba(0,0,0,0.25);
}

.header-section{

    background:
    linear-gradient(
        135deg,
        #198754,
        #0f5132
    );

    color:white;

    text-align:center;

    padding:35px 20px;
}

.logo{

    width:90px;
    height:90px;

    object-fit:contain;

    margin-bottom:15px;
}

.company-name{

    font-size:28px;

    font-weight:800;

    margin-bottom:5px;
}

.subtitle{

    opacity:0.9;

    font-size:14px;
}

.body-section{
    padding:35px;
}

.info-box{

    background:#f8f9fa;

    border-left:5px solid #198754;

    padding:15px;

    border-radius:8px;

    margin-bottom:25px;
}

.info-box p{
    margin:0;
    color:#555;
}

label{
    font-weight:600;
    margin-bottom:8px;
}

input[type="email"]{

    width:100%;

    padding:12px 15px;

    border:1px solid #ced4da;

    border-radius:10px;

    transition:0.3s;
}

input[type="email"]:focus{

    border-color:#198754;

    outline:none;

    box-shadow:0 0 0 0.25rem rgba(25,135,84,.15);
}

.btn-reset{

    width:100%;

    background:#198754;

    color:white;

    border:none;

    padding:13px;

    border-radius:10px;

    font-weight:700;

    transition:0.3s;
}

.btn-reset:hover{

    background:#146c43;

    transform:translateY(-2px);
}

.footer-links{

    text-align:center;

    margin-top:20px;
}

.footer-links a{

    color:#198754;

    text-decoration:none;

    font-weight:600;
}

.footer-links a:hover{
    text-decoration:underline;
}

.footer-note{

    text-align:center;

    margin-top:20px;

    color:#888;

    font-size:13px;
}

</style>
</head>
<body>

<div class="reset-wrapper">

    <div class="reset-card">

        <div class="header-section">

            <img
                src="/static/images/logo.png"
                class="logo"
                alt="Wareng MRF ERP Logo"
            >

            <div class="company-name">
                Wareng MRF ERP
            </div>

            <div class="subtitle">
                Password Recovery Portal
            </div>

        </div>

        <div class="body-section">

            <div class="info-box">

                <p>
                    Enter your registered email address and we'll send
                    secure instructions to reset your password.
                </p>

            </div>

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn-reset">
                    Send Password Reset Link
                </button>

            </form>

            <div class="footer-links">

                <a href="{% url 'login' %}">
                    ← Back to Login
                </a>

            </div>

            <div class="footer-note">
                © 2026 Wareng MRF ERP System
            </div>

        </div>

    </div>

</div>

</body>
</html>
